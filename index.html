<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Compras</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Lista de Compras</h1>
    <p class="subtitulo">Orçamento disponível: <strong>R$ 100,00</strong></p>

    <section class="formulario">
      <input type="text" id="nome" placeholder="Nome do item (ex: Arroz)" autocomplete="off" />
      <input type="number" id="preco" placeholder="Preço (ex: 25.50)" step="0.01" />
      <button type="button" id="btn-adicionar">Adicionar</button>
    </section>

    <p id="mensagem" class="mensagem"></p>

    <section class="resumo">
      <div>Itens: <strong id="qtd-itens">0</strong></div>
      <div>Total: <strong id="total">R$ 0.00</strong></div>
      <div>Saldo: <strong id="saldo">R$ 100.00</strong></div>
    </section>

    <p id="status-orcamento" class="status">Dentro do orçamento</p>

    <ul id="lista" class="lista"></ul>

    <div class="acoes">
      <button type="button" id="btn-limpar" class="btn-secundario">Limpar tudo</button>
    </div>
  </main>

  <script defer src="app.js"></script>
</body>
</html>
